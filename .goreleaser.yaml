version: 2

project_name: stackup

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: stackup
    main: ./cmd/stackup
    binary: stackup
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE*

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'

brews:
  - name: stackup
    repository:
      owner: Gabox301
      name: homebrew-stackup
      token: '{{ .Env.HOMEBREW_TAP_TOKEN }}'
    homepage: https://github.com/Gabox301/Stackup
    description: Detect your project's stack and generate IDE configs for it.
    license: MIT
    commit_author:
      name: goreleaserbot
      email: goreleaser@carlosbecker.com

scoops:
  - name: stackup
    repository:
      owner: Gabox301
      name: scoop-bucket
      token: '{{ .Env.SCOOP_BUCKET_TOKEN }}'
    homepage: https://github.com/Gabox301/Stackup
    description: Detect your project's stack and generate IDE configs for it.
    license: MIT
    commit_author:
      name: goreleaserbot
      email: goreleaser@carlosbecker.com
