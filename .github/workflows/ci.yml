# CI gate: build, vet, gofmt, and tests on every push and pull request.
# Runs on ubuntu-latest with Go 1.27 to match the release workflow.
# All steps are non-interactive: no TTY, no TUI, plain go commands only.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Run tests
        run: go test ./... -count=1
